# Verdigris (tui/palette.ts), as the viewer's Files mode is drawn in the layout design.
# Its #5fcca9 is the theme colour, ACCENT in tui/palette.ts; TOML has no
# variables, so tests/contract/colours.test.mjs holds each use to it.

[mgr]
cwd            = { fg = "#5fcca9", bold = true }
border_symbol  = "│"
border_style   = { fg = "#373d3c" }
symlink_target = { fg = "#a2bdb5", italic = true }

# The bar on the hovered file. Its padding is drawn in the bar color, so full
# blocks give it square ends.
[indicator]
parent  = { fg = "#0a0b0b", bg = "#5fcca9", bold = true }
current = { fg = "#0a0b0b", bg = "#5fcca9", bold = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[mode]
normal_main = { fg = "#0a0b0b", bg = "#5fcca9", bold = true }
normal_alt  = { fg = "#5fcca9" }
select_main = { fg = "#0a0b0b", bg = "#f2647e", bold = true }
select_alt  = { fg = "#f2647e" }
unset_main  = { fg = "#0a0b0b", bg = "#f2647e", bold = true }
unset_alt   = { fg = "#f2647e" }

[status]
perm_sep   = { fg = "#a2bdb5" }
perm_type  = { fg = "#a2bdb5" }
perm_read  = { fg = "#a2bdb5" }
perm_write = { fg = "#a2bdb5" }
perm_exec  = { fg = "#a2bdb5" }

[filetype]
rules = [
	{ url = "*/", fg = "#5fcca9", bold = true },
	{ url = "*", fg = "#d9e9e3" },
]
