# The outer tmux: one session per Ghostty window, laying it out as btop on top,
# the viewer on the left and the tab session (tmux.conf) on the right. It runs
# on its own socket (tmux -L ghostty-layout) and stays out of the way, with no
# status bar and no prefix, so keys reach the tab session. bin/ghostty-surface
# builds each session.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
# Lets the viewer, and programs in the tabs, show images in Ghostty.
set -g allow-passthrough on
set -g mouse on
set -g status off
# The Ghostty window's title names its session (layout-<n>) as a word of its
# own: the Agents widget raises the window whose title names the layout
# session the tray acted in (raiseGhostty in the plasmoid's main.qml).
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g prefix None
set -g prefix2 None
unbind C-b

# Sessions are built detached, so one may only end with its window once its
# window has attached.
set-hook -g client-attached "set destroy-unattached on"

# btop's pane (@top) only displays, and the rails (@rail, see add_hub in
# bin/lib/layout.sh) take only clicks. Neither keeps focus, so keys meant for
# the viewer, the tabs or the hub can't land in them.
set-hook -g after-select-pane 'if -F "#{||:#{@top},#{@rail}}" "last-pane"'

# Mouse events over btop are dropped, so a stray click or a drag that runs up
# over it can't reach btop's menus. Elsewhere these are tmux's defaults, less
# the right-click pane menu with its Kill item.
# A click on a rail reaches the rail without selecting its pane.
bind -n MouseDown1Pane if -F "#{@rail}" { send-keys -M -t = } { if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M } }
bind -n MouseDown2Pane if -F "#{!:#{@top}}" { select-pane -t = ; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p } }
bind -n MouseDown3Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n DoubleClick1Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n TripleClick1Pane if -F "#{!:#{@top}}" { select-pane -t = ; send-keys -M }
bind -n MouseDrag1Pane if -F "#{!:#{@top}}" { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } }
bind -n WheelUpPane if -F "#{!:#{@top}}" { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e } }
bind -n WheelDownPane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp1Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp2Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseUp3Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDrag2Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDrag3Pane if -F "#{!:#{@top}}" { send-keys -M }
bind -n MouseDragEnd1Pane if -F "#{!:#{@top}}" { send-keys -M }
unbind -n M-MouseDown3Pane

# The line under btop doesn't drag, so a pan that runs up over it can't start
# resizing btop. tmux gives that line to btop's pane; the divider beside the
# viewer, which belongs to the viewer, still drags. The hub's list keeps its
# width beside an open session (@peek), so the hub (@hub 1) and that session
# don't drag either.
bind -n MouseDrag1Border if -F -t = "#{!:#{||:#{@top},#{||:#{==:#{@hub},1},#{@peek}}}}" { resize-pane -M }

# Ghostty sends these for its tab keys (see config.ghostty), so tmux tabs work
# like Ghostty tabs: Ctrl+Shift+T new, Ctrl+Shift+W close, Ctrl+Tab /
# Ctrl+Shift+Tab or Ctrl+Shift+Right / Left next and previous, Ctrl+Shift+
# PageUp / PageDown move the tab left and right. They act on the window's tab
# session, whichever pane has focus, except in a session the hub opened
# (@peek), where they act on the tabs that pane shows. A background agent's
# session there has no tabs (its pane runs `ghostty-hub attach`, and the hub
# names the agent's folder on it, @peek_bg), so Ctrl+Shift+T opens a
# terminal in that folder in a popup instead (bin/ghostty-term). The pane's
# command counts as well as the folder: a session opened before the hub
# named one has none. The tab server is -L ghostty unless
# $AGENT_HUB_TABS_SOCKET moves it, as tests do (bin/lib/core.sh).
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
set -s user-keys[3] "\e[9004~"
set -s user-keys[4] "\e[9005~"
set -s user-keys[5] "\e[9006~"
set -s user-keys[6] "\e[9007~"
set -s user-keys[7] "\e[9008~"
set -s user-keys[8] "\e[9009~"
bind -n User0 if -F "#{||:#{@peek_bg},#{m:*ghostty-hub attach *,#{pane_start_command}}}" { run-shell -b '"#{@conf}/bin/ghostty-term" "#{client_name}" "#{pane_id}"' } { run-shell -b 'tmux -L "${AGENT_HUB_TABS_SOCKET:-ghostty}" new-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -c "##{pane_current_path}"' }
# Close goes through ghostty-tabs --close, which keeps the workspace open
# when its last tab is closed from anywhere but the workspace itself: from a
# session the hub opened (its tab can be the workspace's Claude, linked in),
# or with the workspace hidden behind the hub or the diagrams (keep).
bind -n User1 run-shell -b '"#{@conf}/bin/ghostty-tabs" --close "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}" "" "#{?#{==:#{window_name},work},,keep}"'
bind -n User2 run-shell -b 'tmux -L "${AGENT_HUB_TABS_SOCKET:-ghostty}" next-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}"'
bind -n User3 run-shell -b 'tmux -L "${AGENT_HUB_TABS_SOCKET:-ghostty}" previous-window -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}"'
bind -n User4 run-shell -b 'tmux -L "${AGENT_HUB_TABS_SOCKET:-ghostty}" swap-window -d -s "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:-1"'
bind -n User5 run-shell -b 'tmux -L "${AGENT_HUB_TABS_SOCKET:-ghostty}" swap-window -d -s "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:" -t "#{?#{@peek},peek-#{s/%//:pane_id},#{s/^layout-/ghostty-/:session_name}}:+1"'


# Ctrl+Shift+A shows the agent view: the hub with focus in the session it
# opened beside its list. With none open, the hub opens the last one again,
# else the selected agent (hub.ts AGENT_VIEW_KEY). As for Ctrl+Shift+B below,
# every format reads the hub window (-t :hub).
bind -n User6 {
  select-window -t :hub
  if -F -t :hub "#{@peek_pane}" {
    run -C -t :hub 'select-pane -t "#{@peek_pane}"'
  } {
    run -C -t :hub 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9106~"'
  }
}

# Ctrl+Shift+B goes back to the board from anywhere in the window: it shows
# the hub and closes the session the hub opened beside its list (the hub
# window's @peek_pane), so the workspace lands on the board too, not on a
# session left open there. Every format reads the hub window (-t :hub), as
# @peek_pane is its option, not the workspace's. The hub hears first (hub.ts
# PEEK_CLOSING_KEY), so when its pane widens it draws the board straight
# away rather than the list stretched across.
bind -n User7 {
  select-window -t :hub
  if -F -t :hub "#{@peek_pane}" {
    run -C -t :hub 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9101~"'
    run -C -t :hub 'kill-pane -t "#{@peek_pane}"'
    run -C -t :hub 'select-pane -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}"'
  }
}

# Ctrl+Shift+W goes to the workspace, like the rail's work button. A session
# open in the hub stays open there for Ctrl+Shift+A to come back to.
bind -n User8 select-window -t :work

# Alt+← moves focus from the session the hub opened beside its list back to
# the list, and Alt+→ from the list into the session, so you can pick another
# agent with j/k (the session follows the selection, hub/peek.ts preview)
# and land in its session without the mouse. The
# hub pane's own @hub is 1; every other pane's names the hub pane. A key
# with nowhere to go goes through, so Alt+→ still moves a word right in the
# session and Alt+← a word left in the hub's filter; in the session, Ctrl+←
# moves a word left. run -C expands the formats, which a bare -t wouldn't.
bind -n M-Left if -F "#{&&:#{==:#{window_name},hub},#{&&:#{@peek_pane},#{!=:#{@hub},1}}}" {
  run -C 'select-pane -t "#{@hub}"'
} { send-keys M-Left }
bind -n M-Right if -F "#{&&:#{==:#{window_name},hub},#{&&:#{@peek_pane},#{==:#{@hub},1}}}" {
  run -C 'select-pane -t "#{@peek_pane}"'
} { send-keys M-Right }

# Alt+S opens Settings in a popup over the whole window (bin/ghostty-settings),
# as the rail's ⚙ button does. Inside the popup Alt+S reaches the panel,
# which closes it.
bind -n M-s run-shell -b '"#{@conf}/bin/ghostty-settings" "#{client_name}"'

# Alt+A opens what babysitters proposed, to approve, edit or turn down:
# Monitors (Alt+M) with its approvals panel on the monitor whose proposal
# has waited longest (bin/ghostty-approvals). Inside the popup Alt+A reaches
# Monitors, which closes it.
bind -n M-a run-shell -b '"#{@conf}/bin/ghostty-approvals" "#{client_name}"'

# Alt+M opens Monitors in a popup over the whole window (bin/ghostty-monitors):
# every monitor agentd knows, your open PRs and MRs to attach a pr-babysit
# monitor to, your pipelines, and a log watcher to start. Inside the popup
# Alt+M reaches the list, which closes it.
bind -n M-m run-shell -b '"#{@conf}/bin/ghostty-monitors" "#{client_name}" "#{session_name}"'

# Alt+N starts a new agent from anywhere in the window: the workspace, the
# board, its list or the session it opened. It shows the hub and hands its
# pane a key of its own (hub.ts NEW_AGENT_KEY), which the hub answers even
# mid-filter, where an n would be typed. In the hub pane @hub is 1, so the
# target is that pane itself; anywhere else @hub names it.
bind -n M-n {
  select-window -t :hub
  run -C 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9100~"'
}

# Alt+D shows Claude's diagrams for the tab you're looking at, in a window of
# their own (bin/ghostty-diagrams): in the workspace, the active tab. In the
# hub it hands the hub a key of its own (hub.ts DIAGRAMS_KEY), since only
# the hub knows the tab of the session it opened or of the card selected on
# the board. In the diagrams window it sends dv a key of its own (keys.ts
# DIAGRAMS_CLOSE_KEY), which closes it: not M-d, which still reaches dv as a
# plain key once Settings › Keybinds moves this binding elsewhere.
# @conf is the folder this file is in, where bin/ is.
set -gF @conf "#{d:current_file}"
bind -n M-d if -F "#{==:#{window_name},diagrams}" { send-keys -l "\e[9104~" } {
  if -F "#{==:#{window_name},hub}" {
    run -C 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9103~"'
  } {
    run-shell -b '"#{@conf}/bin/ghostty-diagrams" "#{s/^layout-//:session_name}" "#{s/^layout-/ghostty-/:session_name}"'
  }
}

# Alt+V shows or hides the viewer pane (bin/ghostty-viewer-toggle); a window
# opens without it. It acts only in the workspace: in the hub, the diagrams
# window or anywhere else it goes through to the pane, as if unbound.
bind -n M-v if -F "#{==:#{window_name},work}" {
  run-shell -b '"#{@conf}/bin/ghostty-viewer-toggle" "#{s/^layout-//:session_name}"'
} { send-keys M-v }

# Alt+H shows the keys in a popup over the whole window (bin/ghostty-help),
# opening on the hub's or the diagrams' keys when pressed there. Inside the
# popup Alt+H reaches the list, which closes it.
bind -n M-h run-shell -b '"#{@conf}/bin/ghostty-help" "#{client_name}" "#{window_name}"'

# Alt+T opens the todo list in a popup over the whole window, from the
# workspace, the board or a session the hub opened (bin/ghostty-todo-panel,
# which sizes it from Settings). Inside the popup Alt+T reaches the list,
# which closes it. Claude's own Alt+T (thinking on or off) never sees the key
# here; ~/.claude/keybindings.json turns it off outside the layout too.
bind -n M-t run-shell -b '"#{@conf}/bin/ghostty-todo-panel" "#{client_name}" "#{pane_current_path}"'

# Alt+E opens a repo in the editor Settings picks (bin/ghostty-editor). In
# the hub it hands the hub a key of its own (hub.ts EDITOR_KEY), since only
# the hub knows the agent of the session it opened or of the card selected
# on the board, and a background agent has no tab to read a folder from.
# Anywhere else it opens the workspace's active tab.
bind -n M-e if -F "#{==:#{window_name},hub}" {
  run -C 'send-keys -t "#{?#{==:#{@hub},1},#{pane_id},#{@hub}}" -l "\e[9105~"'
} {
  run-shell -b '"#{@conf}/bin/ghostty-editor" "#{s/^layout-/ghostty-/:session_name}"'
}

# Ctrl+] does the same in the session pane itself (@peek), and passes through
# anywhere else.
bind -n C-] if -F "#{@peek}" {
  run -C 'send-keys -t "#{@hub}" -l "\e[9101~"'
  kill-pane
} { send-keys C-] }

# Settings › Keybinds: the alt keys above moved to the keys chosen there
# (settings/keybinds.ts). It runs once the server is up, so the file it sources
# can't be stale. Ghostty's ctrl+shift keys (keys.local.ghostty) are brought
# in line too, as settings.json may have changed since the panel last wrote
# them (restored, hand-edited); Ghostty reloads only when that file changes.
run-shell -b '"#{@conf}/bin/ghostty-keys"'

# Catppuccin Mocha borders, matching the tab bar. The focused pane's border
# is blue; tmux colors the corner cells where dividers meet along with it.
# In the hub the divider between the list and the session it opened touches
# both panes, so it would be blue whichever has focus. There it stays grey,
# and while a session is open (hub/peek.ts turns pane-border-status on) a
# line over each pane shows focus instead: heavy blue over the focused pane,
# thin grey over the others and the rail.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "#{?#{==:#{window_name},hub},fg=#45475a,fg=#89b4fa}"
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{@rail},1}},#[fg=#89b4fa]#{R:━,#{pane_width}},#{R:─,#{pane_width}}}"
