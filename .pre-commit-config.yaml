# Linters run on the staged files; each test suite runs only when a file it
# covers is staged. CI runs the lint hooks; its own jobs run the tests.
#   pre-commit install                  once per clone
#   pre-commit run --all-files          everything, by hand

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      # -x with SCRIPTDIR follows each bin/ script into ghostty-lib.sh and lib/,
      # so a variable used one way there and another here is caught.
      - id: shellcheck
        args: [--severity=warning, --external-sources, --source-path=SCRIPTDIR]

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.4
    hooks:
      - id: biome-lint
        additional_dependencies: ["@biomejs/biome@2.6.6"]

  # pass_filenames: false because test.sh runs a whole suite, not single files.
  - repo: local
    hooks:
      # Checks the whole program, not the staged files, since a change to one
      # module can break the types of another. Needs `npm install` once.
      - id: typecheck
        name: typecheck (tsc)
        entry: npx --no-install tsc -p tsconfig.json
        language: system
        pass_filenames: false
        files: ^((ghostty|install)/.*\.ts|tsconfig\.json|package(-lock)?\.json)$
      - id: test-ghostty
        name: tests (ghostty)
        entry: ./test.sh ghostty
        language: system
        pass_filenames: false
        # The unit tests also read layout.conf, the bin/ shell, and the shared
        # fixtures, goldens and harness.
        files: ^(ghostty/|install/walkthrough/|tests/(harness\.mjs|fixtures/|golden/))
        exclude: \.md$
      - id: test-contract
        name: tests (contract)
        entry: ./test.sh contract
        language: system
        pass_filenames: false
        files: ^(ghostty/|tests/|plasmoid/|install|hub-plugin/)
        exclude: \.md$
      - id: test-hub
        name: tests (hub plugin)
        entry: ./test.sh hub
        language: system
        pass_filenames: false
        files: ^(hub-plugin/|ghostty/bin/lib/log\.sh$)
        exclude: \.md$
      - id: test-mods
        name: tests (mods)
        entry: ./test.sh mods
        language: system
        pass_filenames: false
        files: ^diagram-plugin/
        exclude: \.md$
